# Deploy Preview for deploy-platform service repos.
#
# Any PR touching deploy/ gets a full render + validation and a sticky
# "Deploy Preview" comment with the SC-11 readiness scorecard. The reusable
# deploy-validate.yml workflow owns the gate-summary emission and the comment.
#
# This repo went without one for six weeks, during which a three-field gap in
# its deployment declaration survived unnoticed: its PR CI packs a bundle with
# its own script and never invokes the toolkit, so a schema or context change
# was only ever proven at release time.
name: Deploy Preview

on:
  pull_request:
    paths:
      - 'deploy/**'
      # schema-version and context-ref live in this file, and they decide whether
      # rendering works at all. Without this, a pin bump to a broken toolkit or a
      # stale context digest merges with no preview -- which is how a release with a
      # context-resolution bug reached every repository.
      - .github/workflows/deploy-preview.yml

permissions: {}

jobs:
  deploy-preview:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-validate.yml@6d4af5313cc39386fff796fa89ea940ef5f0819d # v0.16.1
    with:
      deploy-dir: deploy
      schema-version: 0.22.0
      image-lock-path: deploy/images.lock.json
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:95dc39fc695694c8fb4b0c538d7fe13038d407c7302c3725c98f0496c6a83499
      environments: production
      comment: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
