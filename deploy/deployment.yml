apiVersion: deployment.jorisjonkers.dev/v2
kind: Deployment
metadata:
  name: stalwart-provisioner
spec:
  # Kept in step with the schema-version the release workflow pins. The gate that
  # matters is the toolkit's own check that the cluster context declares the same
  # version as the installed toolkit; schema_pinned here only requires this field
  # to be present and a version string, and its absence once broke every release
  # after 0.3.0 at the deploy-artifact step.
  schemaVersion: 0.20.0
  namespace: mail-system
  workloads:
    - name: stalwart-provisioner
      kind: job
      image:
        alias: stalwart-provisioner
      health:
        timeoutClass: job
        # This is a reconcile job against Stalwart's admin API, not a server:
        # it has no listener and therefore no readiness path. Declared exempt
        # rather than left blank, so the absence is a decision on the record
        # instead of a missing field.
        mandatory: false
      rollbackTargetRetention:
        minimumDays: 90
        acknowledged: true
