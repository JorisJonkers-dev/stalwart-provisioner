name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-target:
    name: Resolve Publish Target
    needs: release-please
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.target.outputs.should_publish }}
      tag_name: ${{ steps.target.outputs.tag_name }}
    steps:
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_RELEASE_TAG" ]; then
              echo "release_tag is required for workflow_dispatch" >&2
              exit 1
            fi
            echo "should_publish=true" >>"$GITHUB_OUTPUT"
            echo "tag_name=$INPUT_RELEASE_TAG" >>"$GITHUB_OUTPUT"
          elif [ "$RELEASE_CREATED" = "true" ]; then
            echo "should_publish=true" >>"$GITHUB_OUTPUT"
            echo "tag_name=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >>"$GITHUB_OUTPUT"
            echo "tag_name=" >>"$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish GHCR Image
    needs: publish-target
    if: ${{ always() && needs.publish-target.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish-target.outputs.tag_name }}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push image
        env:
          IMAGE: ghcr.io/jorisjonkers-dev/stalwart-provisioner
          RELEASE_TAG: ${{ needs.publish-target.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          commit_sha="$(git rev-parse HEAD)"
          docker build -t "${IMAGE}:${version}" -t "${IMAGE}:sha-${commit_sha}" .
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:sha-${commit_sha}"
          echo "Published ${IMAGE}:${version}"

  # Legacy bundle publish — kept intact until Phase 3 removes deployment-sources.yml entry.
  # homelab-deploy deployment-sources.yml still consumes this artifact.
  publish-deploy-bundle:
    name: Publish Deploy Bundle (Legacy)
    needs: [publish-target, publish]
    if: ${{ always() && needs.publish-target.outputs.should_publish == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish-target.outputs.tag_name }}
      - uses: oras-project/setup-oras@v2
      - name: Pack deploy bundle
        env:
          RELEASE_TAG: ${{ needs.publish-target.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          python3 scripts/pack-deploy-bundle.py --version "$version" --out stalwart-provisioner-deploy-bundle.tar
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish deploy bundle
        env:
          BUNDLE: ghcr.io/jorisjonkers-dev/stalwart-provisioner-deploy-bundle
          RELEASE_TAG: ${{ needs.publish-target.outputs.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          oras push "${BUNDLE}:${version}" stalwart-provisioner-deploy-bundle.tar:application/vnd.jorisjonkers.deployment.bundle.v1+tar

  # Standard deploy-artifact pipeline — produces artifact-contract.yaml + cosign signature (SC-10).
  # This artifact satisfies pull-artifacts.mjs contract checks for the registry path.
  # deploy-config-schema must support healthClass: job (Phase 1 release) before this
  # can produce a valid kustomization-health.yml for job workloads.
  resolve-image-lock:
    name: Resolve Image Lock
    needs: [publish-target, publish]
    if: ${{ always() && needs.publish-target.outputs.should_publish == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: images-lock-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish-target.outputs.tag_name }}
      - name: resolve-image-digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jorisjonkers-dev/stalwart-provisioner
          TAG: ${{ needs.publish-target.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "E_FLOATING_IMAGE: could not resolve digest for ${IMAGE}:${version}" >&2
            exit 1
          fi
          echo "image-digest=$digest" >> "$GITHUB_OUTPUT"
      - name: lock-image
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image-digest }}
        run: |
          set -euo pipefail
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "E_FLOATING_IMAGE: IMAGE_DIGEST is not a digest ref" >&2; exit 1 ;;
          esac
          printf '{"stalwart-provisioner":"ghcr.io/jorisjonkers-dev/stalwart-provisioner@%s"}\n' "$IMAGE_DIGEST" \
            > deploy/images.lock.json
      - name: upload-image-lock
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: images-lock-${{ github.run_id }}
          path: deploy/images.lock.json
          retention-days: 1

  publish-deploy-artifact:
    name: Publish Deploy Artifact
    needs: [publish-target, resolve-image-lock]
    if: ${{ always() && needs.publish-target.outputs.should_publish == 'true' && needs.resolve-image-lock.result == 'success' }}
    uses: JorisJonkers-dev/github-workflows/.github/workflows/deploy-artifact.yml@6d4af5313cc39386fff796fa89ea940ef5f0819d # v0.16.1
    with:
      ref: ${{ needs.publish-target.outputs.tag_name }}
      artifact-name: stalwart-provisioner
      artifact-version: ${{ needs.publish-target.outputs.tag_name }}
      schema-version: 0.22.0
      apply-bundle: true
      context-ref: ghcr.io/jorisjonkers-dev/cluster-deploy-context-public@sha256:e839b90839a5f33f1038d305531d9bb2cd85a3a627a436c395c4116533321cc9
      deploy-dir: deploy
      image-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
      environments: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  # -- Register the service in homelab-deploy registry ----------------------
  # Opens/refreshes a PR in homelab-deploy with the pinned artifact digest.
  # Mirrors the pattern from the 6 onboarded services (agents-api, etc.).
  # For first-time registration: creates registry/stalwart-provisioner.yaml
  # with healthClass:job, layer:apps-mail, prune:false + migrationJobDecisions
  # (the rendered Job carries app.kubernetes.io/component=migration, so the
  # migrationJobDecisions entry matches).
  register-service:
    name: Register Service in homelab-deploy
    needs: [publish-target, publish-deploy-artifact]
    if: ${{ always() && needs.publish-target.outputs.should_publish == 'true' && needs.publish-deploy-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: mint-app-token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homelab-deploy

      - name: assert-token-minted
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "E_APP_TOKEN_MISSING: App token was not minted for register-service." >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish-target.outputs.tag_name }}

      - name: build-registry-payload
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ARTIFACT_REF: ${{ needs.publish-deploy-artifact.outputs.artifact-ref }}
          ARTIFACT_DIGEST: ${{ needs.publish-deploy-artifact.outputs.artifact-digest }}
          SERVICE_NAME: stalwart-provisioner
          REPO_OWNER: ${{ github.repository_owner }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.publish-target.outputs.tag_name }}
        run: |
          set -euo pipefail
          branch="registry-update/${SERVICE_NAME}/${TAG}"
          registry_path="registry/${SERVICE_NAME}.yaml"
          repo="${REPO_OWNER}/homelab-deploy"

          if ! gh api "repos/${repo}/git/refs/heads/${branch}" >/dev/null 2>&1; then
            main_sha="$(gh api "repos/${repo}/git/refs/heads/main" --jq '.object.sha')"
            gh api --method POST "repos/${repo}/git/refs" \
              -f ref="refs/heads/${branch}" -f sha="$main_sha" >/dev/null
          fi

          current_sha=""
          if gh api "repos/${repo}/contents/${registry_path}?ref=${branch}" > current.json 2>/dev/null; then
            current_sha="$(jq -r '.sha' current.json)"
            jq -r '.content' current.json | base64 -d > current.yaml
          fi

          python3 - "$SERVICE_NAME" <<'PY'
          import os, sys, yaml

          service = sys.argv[1]
          artifact = {
              "ref": os.environ["ARTIFACT_REF"],
              "digest": os.environ["ARTIFACT_DIGEST"],
              "contractPath": "artifact-contract.yaml",
          }

          if os.path.exists("current.yaml"):
              # Subsequent registration: update artifact only, preserve prune config.
              doc = yaml.safe_load(open("current.yaml"))
              doc["spec"]["artifact"] = artifact
          else:
              # Initial registration: write full DeployUnitRegistration for stalwart-provisioner.
              # healthClass:job — batch/v1 Job workload with TTL-based re-run (Option B).
              # layer:apps-mail — mail-system layer (KNOWN_LAYERS in homelab-deploy registry.mjs).
              # prune.default:false — completed Jobs must not be pruned by Flux.
              # migrationJobDecisions: the rendered Job carries component=migration label,
              # which makes it visible to prune-guardrails.mjs migrationJobDecisions checks.
              doc = {
                  "apiVersion": "deployment.jorisjonkers.dev/deploy-unit-registration/v1",
                  "kind": "DeployUnitRegistration",
                  "metadata": {
                      "name": service,
                      "owner": os.environ["REPO_OWNER"],
                  },
                  "spec": {
                      "artifact": artifact,
                      "namespace": "mail-system",
                      "layer": "apps-mail",
                      "sourceRepository": os.environ["SOURCE_REPOSITORY"],
                      "environments": ["production"],
                      "healthClass": "job",
                      "prune": {
                          "default": False,
                          "pvcDecisions": [],
                          "migrationJobDecisions": [
                              {
                                  "jobName": service,
                                  "decision": "retain",
                                  "reason": (
                                      "One-shot provisioner job; retain completed Job for "
                                      "one reconciliation cycle. TTL (3600 s) handles cleanup."
                                  ),
                              }
                          ],
                          "migrationNamespaceDecisions": [],
                      },
                      "allowedClusterScope": [],
                  },
              }

          yaml.safe_dump(doc, open("registration.yaml", "w"),
                         sort_keys=False, default_flow_style=False)
          PY

          if [ -n "$current_sha" ]; then
            gh api --method PUT "repos/${repo}/contents/${registry_path}" \
              -f message="chore(registry): update ${SERVICE_NAME} to ${TAG}" \
              -f content="$(base64 -w0 registration.yaml)" \
              -f sha="$current_sha" -f branch="$branch" >/dev/null
          else
            gh api --method PUT "repos/${repo}/contents/${registry_path}" \
              -f message="chore(registry): register ${SERVICE_NAME}" \
              -f content="$(base64 -w0 registration.yaml)" \
              -f branch="$branch" >/dev/null
          fi

          open_prs="$(gh api "repos/${repo}/pulls?head=${REPO_OWNER}:${branch}&state=open" --jq 'length')"
          if [ "$open_prs" -eq 0 ]; then
            gh api --method POST "repos/${repo}/pulls" \
              -f title="chore(registry): register ${SERVICE_NAME} ${TAG}" \
              -f body="Initial registry entry for stalwart-provisioner. healthClass:job, layer:apps-mail. Artifact: ${ARTIFACT_REF}" \
              -f head="$branch" -f base="main" >/dev/null
            echo "Opened registry PR for ${SERVICE_NAME} ${TAG}"
          else
            echo "Updated existing registry PR for branch ${branch}"
          fi
