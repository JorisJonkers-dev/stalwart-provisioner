[project]
name = "stalwart-provisioner"
dynamic = ["version"]
license = "LicenseRef-JorisJonkers-Proprietary-1.0"
requires-python = "==3.15.1"
dependencies = []

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["bin/stalwart-provisioner", "schema/validate-plan.py", "tests"]
